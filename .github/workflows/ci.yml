name: CI
on:
  push:
    branches: ['**']  # every branch (incl. slashed names like sam/feature); '*' would miss those
    tags: ["*"]
  pull_request:
jobs:
  test:
    name: ${{ matrix.backend }} - Julia ${{ matrix.version }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - lts
          - '1' # latest stable 1.x release of Julia
        backend:
          - DevitoOpen # open-source `devito`
          - DevitoPro  # licensed `devitopro` (needs the DEVITOPRO secret)

    env:
      DEVITO_LANGUAGE: "openmp"
      DEVITO_ARCH: "gcc"
      OMP_NUM_THREADS: "2"
      DEVITO_AUTOPADDING: "0"
      RDMAV_FORK_SAFE: 1

    steps:
      - uses: actions/checkout@v4
      - name: Set shared Conda environment
        run: echo "JULIA_CONDAPKG_ENV=$RUNNER_TEMP/devito-conda" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2

      # devitopro bundles devito as a submodule that pip can't fetch from a git+ URL, so
      # DevitoPro/CondaPkg.toml installs it from a local recursive clone; it must be writable
      # (devitopro builds in-tree). Requires the DEVITOPRO secret.
      - name: Provision devitopro clone
        if: matrix.backend == 'DevitoPro'
        run: |
          sudo git clone --recurse-submodules --depth 1 "$DEVITO_PRO" /opt/devitopro
          sudo chown -R "$(id -un)" /opt/devitopro
        env:
          DEVITO_PRO: ${{ secrets.DEVITOPRO }}

      # Dev this checkout's packages into a scratch project; Julia 1.10 ignores [sources].
      - name: Set up test environment
        run: julia --color=yes --project="$RUNNER_TEMP/testenv" -e 'using Pkg; Pkg.develop([PackageSpec(path=abspath("Devito")), PackageSpec(path=abspath("${{ matrix.backend }}"))]); Pkg.add(["CondaPkg", "MPIPreferences"])'

      # Writes the backend's test/LocalPreferences.toml, which Pkg.test copies into the test env.
      - name: Configure Conda MPI for the test env
        run: |
          julia --project="$RUNNER_TEMP/testenv" -e '
            using Pkg, CondaPkg, MPIPreferences
            prefix = CondaPkg.envdir()
            library = joinpath(prefix, "lib", "libmpi.so")
            launcher = joinpath(prefix, "bin", "mpiexec")
            @assert isfile(library)
            @assert isfile(launcher)
            Pkg.activate("${{ matrix.backend }}/test")
            CondaPkg.withenv() do
              MPIPreferences.use_system_binary(; library_names=[library], mpiexec=launcher)
            end
          '

      # coverage=true would only track the backend package, so track Devito's code instead.
      - name: Run tests
        run: julia --color=yes --check-bounds=yes --project="$RUNNER_TEMP/testenv" -e 'using Pkg; Pkg.test("${{ matrix.backend }}"; coverage="@" * abspath("Devito"))'

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: Devito/src

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      DEVITO_LANGUAGE: "openmp"
      DEVITO_ARCH: "gcc"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Instantiate docs
        run: julia --project=docs -e 'using Pkg; Pkg.develop([PackageSpec(path=abspath("Devito")), PackageSpec(path=abspath("DevitoOpen"))]); Pkg.instantiate()'

      - name: Build and deploy docs
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
