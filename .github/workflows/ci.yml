name: CI
on:
  push:
    branches: ['**']  # every branch (incl. slashed names like sam/feature); '*' would miss those
    tags: ["*"]
  pull_request:
jobs:
  test:
    name: ${{ matrix.backend }} - Julia ${{ matrix.version }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - lts
          - '1' # latest stable 1.x release of Julia
        backend:
          - DevitoOpen # open-source `devito`
          - DevitoPro  # licensed `devitopro` (needs the DEVITOPRO secret)

    env:
      DEVITO_LANGUAGE: "openmp"
      DEVITO_ARCH: "gcc"
      OMP_NUM_THREADS: "2"
      DEVITO_AUTOPADDING: "0"
      RDMAV_FORK_SAFE: 1

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2

      # MPI.jl and the CondaPkg-built mpi4py both link this one system MPI (the decoupler
      # requires Julia and Python to share a single MPI).
      - name: Setup system MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: 'openmpi'

      # devitopro bundles devito as a submodule that pip can't fetch from a git+ URL, so
      # DevitoPro/CondaPkg.toml installs it from a local recursive clone; it must be writable
      # (devitopro builds in-tree). Requires the DEVITOPRO secret.
      - name: Provision devitopro clone
        if: matrix.backend == 'DevitoPro'
        run: |
          sudo git clone --recurse-submodules --depth 1 "$DEVITO_PRO" /opt/devitopro
          sudo chown -R "$(id -un)" /opt/devitopro
        env:
          DEVITO_PRO: ${{ secrets.DEVITOPRO }}

      - name: Configure system MPI for the test env
        run: julia --project=${{ matrix.backend }}/test -e 'using Pkg; Pkg.instantiate(); using MPIPreferences; MPIPreferences.use_system_binary()'

      - name: Run tests
        run: julia --color=yes --check-bounds=yes --project=${{ matrix.backend }} -e 'using Pkg; Pkg.test(coverage=true)'

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: Devito/src

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      DEVITO_LANGUAGE: "openmp"
      DEVITO_ARCH: "gcc"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      # `using Devito` during the build installs the open backend + mpi4py via CondaPkg;
      # the mpi4py source build needs an MPI toolchain.
      - name: Setup system MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: 'openmpi'

      - name: Instantiate docs
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build and deploy docs
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
