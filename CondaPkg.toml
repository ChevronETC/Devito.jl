# Temporary "always-PRO" validation config (see docs/python-dependency-management.md).
# devitopro is installed from a local recursive clone because pip cannot fetch its
# bundled devito submodule from a git+ URL.
[deps]
python = ">=3.10,<3.14"  # devitopro requires Python <3.14

[pip.deps]
devitopro = { version = "@ file:///opt/devitopro", extras = ["extras"] }
# versions from devito's requirements-mpi.txt; binary="no" forces a source build so
# mpi4py links the same system Open MPI as Julia's MPI.jl (ABI must match)
mpi4py = { version = "<4.1.3", binary = "no" }
ipyparallel = "<9.3"
